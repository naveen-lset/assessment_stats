<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Animal Details · iPad</title>
<link rel="stylesheet" href="../../../app/tokens.css">
<link rel="stylesheet" href="../../../app/type.css">
<link rel="stylesheet" href="../../../app/components.css">
<link rel="stylesheet" href="../../../app/modules/hospital.css">
<link rel="stylesheet" href="../../../app/icons/icons.css">
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="touch.css">
<link rel="stylesheet" href="species.css">
</head>
<body>
<div class="app" id="app">
  <div class="statusbar" aria-hidden="true"><span class="l"><span class="t-body-title">9:41 AM</span><span class="t-body-medium">Tue Sep 29</span></span><span class="r"><span class="t-body-title">100%</span><span class="battery"></span></span></div>
  <div class="view" id="view"></div>
  <nav class="tabnav" id="tabnav" aria-label="Sections">
    <button data-tab="animals"><span class="ic"><span class="app-icon app-icon--tint i-paw" style="color: var(--on-primary-container)"></span></span><span class="t-body-medium">Animals</span></button>
    <button data-tab="masters"><span class="ic"><span class="app-icon app-icon--tint i-reason-or-list" style="color: var(--on-primary-container)"></span></span><span class="t-body-medium">Assessment Masters</span></button>
  </nav>
  <div class="scrim scrim--sheet" id="scrimSheet"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="scrim scrim--panel" id="scrimPanel"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
  <div class="pop-scrim" id="popScrim" hidden></div>
  <div class="pop" id="pop" hidden></div>
  <div class="viewer" id="viewer" hidden></div>
  <div class="toast t-body-medium" id="toast" role="status"><span class="app-icon app-icon--20 app-icon--tint i-just-tick-mark" style="color: var(--primary-container)"></span><span id="toastMsg"></span><button class="t-body-title" id="toastUndo" hidden>Undo</button></div>
</div>
<script src="touch.js"></script>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
